<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マラソン漢字 — Maratona de Kanji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1EADC;
    --paper-2:#E8DFCB;
    --ink:#241F1A;
    --ink-soft:#4A433B;
    --muted:#948A78;
    --line:#D8CDB4;
    --indigo:#2B3F63;
    --indigo-dim:#5B6E8E;
    --stamp:#AB3327;
    --stamp-soft:#c96a5f;
    --gold:#9C7A34;
    --card-bg:#FBF7ED;
    --shadow: 0 1px 0 rgba(36,31,26,0.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(36,31,26,0.05) 1px, transparent 0);
    background-size: 14px 14px;
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:clamp(14px,4vw,22px) clamp(12px,4vw,18px) 60px;}

  /* ---- Header ---- */
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    border-bottom:2px solid var(--ink);
    padding-bottom:12px;
    margin-bottom:16px;
    gap:10px 14px;
  }
  .brand{display:flex; align-items:baseline; gap:8px; min-width:0;}
  .brand .glyph{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:clamp(26px,7vw,34px);
    color:var(--stamp);
    line-height:1;
    flex:0 0 auto;
  }
  .brand h1{
    font-family:'Shippori Mincho', serif;
    font-weight:600;
    font-size:clamp(16px,4.2vw,19px);
    margin:0;
    letter-spacing:0.02em;
  }
  .brand > div:last-child{min-width:0;}
  .brand .sub{font-size:11px;color:var(--muted); margin-top:2px; line-height:1.35;}

  /* ---- Day strip ---- */
  .strip-wrap{margin-bottom:22px;}
  .strip-title{font-size:12px; color:var(--muted); margin-bottom:8px; display:flex; justify-content:space-between;}
  .strip{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:8px;
    scrollbar-width:thin;
  }
  .strip::-webkit-scrollbar{height:5px;}
  .strip::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}
  .day-chip{
    flex:0 0 auto;
    min-width:46px;
    min-height:44px;
    border:1.5px solid var(--line);
    background:var(--card-bg);
    border-radius:3px;
    padding:8px 10px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s, transform .1s;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:manipulation;
  }
  .day-chip:hover{border-color:var(--indigo-dim);}
  .day-chip .n{font-size:15px; color:var(--ink); font-weight:700;}
  .day-chip.today{border-color:var(--indigo); box-shadow: inset 0 0 0 1px var(--indigo);}
  .day-chip.selected{background:var(--ink); border-color:var(--ink);}
  .day-chip.selected .n{color:var(--paper);}
  .day-chip.done::after{
    content:"完";
    position:absolute; top:-7px; right:-6px;
    font-family:'Shippori Mincho', serif;
    font-size:11px; color:#fff; background:var(--stamp);
    width:17px;height:17px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    transform:rotate(-8deg);
    box-shadow:0 1px 2px rgba(0,0,0,0.25);
  }

  /* ---- Day panel ---- */
  .panel{
    background:var(--card-bg);
    border:1.5px solid var(--line);
    border-radius:4px;
    padding:clamp(14px,4vw,18px) clamp(14px,4vw,18px) 20px;
    margin-bottom:18px;
  }
  .panel-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; flex-wrap:wrap; gap:6px;}
  .panel-head h2{font-family:'Shippori Mincho', serif; font-size:18px; margin:0; font-weight:600;}
  .panel-head .date{font-size:12px; color:var(--muted);}
  .progress-line{display:flex; align-items:center; gap:8px; margin-bottom:16px;}
  .progress-track{flex:1; height:6px; background:var(--line); border-radius:3px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--stamp); border-radius:3px; transition:width .3s;}
  .progress-num{font-size:11.5px; color:var(--ink-soft); white-space:nowrap; font-variant-numeric:tabular-nums;}

  .tile-grid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:clamp(5px,1.8vw,8px);
    margin-bottom:18px;
  }
  .tile{
    aspect-ratio:1;
    border:1.5px solid var(--line);
    border-radius:3px;
    background:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Shippori Mincho', serif;
    font-size:clamp(18px,6.5vw,26px);
    font-weight:600;
    position:relative;
    color:var(--ink);
  }
  .tile .mark{
    position:absolute; bottom:3px; right:4px;
    font-size:8px; color:var(--stamp); font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700;
  }
  .tile.mastered{background:#fff; border-color:var(--stamp); color:var(--stamp);}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:14px;
    padding:13px 20px;
    min-height:46px;
    border-radius:3px;
    border:1.5px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
    width:100%;
    touch-action:manipulation;
    transition:opacity .15s, transform .1s;
  }
  .btn:active{transform:scale(0.98);}
  .btn.secondary{background:transparent; color:var(--ink); border-color:var(--line);}
  .btn.ghost{background:transparent; color:var(--muted); border:none; width:auto; padding:8px 4px; font-weight:500; font-size:12.5px;}
  .btn:disabled{opacity:0.45; cursor:default;}

  .hint{font-size:12px; color:var(--muted); text-align:center; margin-top:10px; line-height:1.5;}

  /* ---- Drill overlay ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(36,31,26,0.55);
    display:none; align-items:center; justify-content:center; z-index:50;
    padding:clamp(8px,3vw,16px);
    backdrop-filter: blur(2px);
  }
  .overlay.active{display:flex;}
  .drill-box{
    background:var(--paper); border-radius:6px; width:100%; max-width:420px;
    max-height:94vh; overflow-y:auto;
    padding:clamp(16px,5vw,22px) clamp(14px,4.5vw,20px) clamp(18px,5vw,24px);
    position:relative;
    border:1.5px solid var(--ink);
  }
  .drill-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .drill-top .lbl{font-size:12px; color:var(--muted);}
  .close-x{cursor:pointer; font-size:13px; color:var(--muted); background:none; border:none; font-family:inherit; padding:6px; touch-action:manipulation;}

  .dots{display:flex; gap:4px; justify-content:center; margin:14px 0 6px;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--line);}
  .dot.filled{background:var(--stamp);}

  .flip-scene{perspective:1200px; margin:14px 0;}
  .flip-card{
    position:relative; width:100%; height:clamp(170px,42vh,230px);
    transform-style:preserve-3d; transition:transform .45s cubic-bezier(.4,.2,.2,1);
    cursor:pointer;
    touch-action:manipulation;
  }
  .flip-card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute; inset:0; backface-visibility:hidden;
    border-radius:5px; border:1.5px solid var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--card-bg);
    padding:12px;
    text-align:center;
  }
  .face.front .k{font-family:'Shippori Mincho', serif; font-size:clamp(56px,18vw,96px); font-weight:600; line-height:1;}
  .face.front .tap{position:absolute; bottom:10px; font-size:11px; color:var(--muted);}
  .face.back{transform:rotateY(180deg); background:var(--indigo); color:var(--paper); border-color:var(--indigo);}
  .face.back .meaning{font-size:clamp(16px,4.5vw,19px); font-weight:700; margin-bottom:12px; font-family:'Shippori Mincho', serif;}
  .face.back .reading-row{font-size:13px; margin-bottom:5px; opacity:0.92;}
  .face.back .reading-row b{font-weight:700; opacity:0.75; margin-right:6px; font-size:11px; letter-spacing:0.04em;}

  .answer-row{display:flex; gap:10px; margin-top:16px;}
  .answer-row .btn{font-size:14.5px; padding:13px 8px;}
  .btn.wrong{background:transparent; border-color:var(--stamp-soft); color:var(--stamp);}
  .btn.right{background:var(--indigo); border-color:var(--indigo);}

  .queue-note{text-align:center; font-size:11.5px; color:var(--muted); margin-top:14px;}

  .done-screen{text-align:center; padding:10px 0;}
  .done-screen .glyph{font-family:'Shippori Mincho', serif; font-size:48px; color:var(--stamp);}
  .done-screen h3{font-family:'Shippori Mincho', serif; margin:8px 0 4px;}
  .done-screen p{color:var(--ink-soft); font-size:13.5px; margin:0 0 18px;}

  footer{text-align:center; margin-top:26px;}
  footer button{background:none;border:none;color:var(--muted);font-size:11.5px;cursor:pointer;font-family:inherit;text-decoration:underline;}

  @media (max-width:380px){
    .tile-grid{gap:5px;}
    .strip-title{font-size:11px;}
  }
  @media (max-height:640px){
    .flip-card{height:clamp(150px,38vh,200px);}
    .flip-scene{margin:10px 0;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="glyph">漢</div>
      <div>
        <h1>マラソン漢字</h1>
        <div class="sub">Kanji de N4 e N3 — 10 por dia</div>
      </div>
    </div>
  </header>

  <div class="strip-wrap">
    <div class="strip-title"><span id="stripTitle">— dias · — kanji</span><span id="overallProgress">0% concluído</span></div>
    <div class="strip" id="dayStrip"></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2 id="panelTitle">Dia 1</h2>
    </div>
    <div class="progress-line">
      <div class="progress-track"><div class="progress-fill" id="dayProgressFill" style="width:0%"></div></div>
      <div class="progress-num" id="dayProgressNum">0/10 dominados</div>
    </div>
    <div class="tile-grid" id="tileGrid"></div>
    <button class="btn" id="startBtn">Iniciar treino</button>
    <div class="hint">Cada kanji precisa de <b>10 acertos</b> para ser dominado. Errou? Ele volta para o baralho.</div>
  </div>

  <footer>
    <button id="resetBtn">Reiniciar todo o progresso</button>
  </footer>
</div>

<div class="overlay" id="overlay">
  <div class="drill-box" id="drillBox"></div>
</div>

const BATCH_SIZE = 10;
const TOTAL_DAYS = Math.ceil(KANJI.length / BATCH_SIZE); // 50
const START_DATE = new Date(2026, 8, 1); // 1 Sep 2026 (month is 0-indexed)
const MASTERY = 10;

const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function fmtDate(d){ return d.getDate() + " " + MESES[d.getMonth()]; }
function dateKeyDiff(a,b){ return Math.round((b.setHours(0,0,0,0) - a.setHours(0,0,0,0)) / 86400000); }

function getBatch(dayNum){
  const start = (dayNum-1)*BATCH_SIZE;
  return KANJI.slice(start, start+BATCH_SIZE);
}

/* ---------- STATE ---------- */
let progress = {}; // { day1: {"日":7, "一":10, ...}, ... }
let selectedDay = 1;
let drillQueue = [];
let drillIndex = 0;
let flipped = false;
let storageOk = true;

async function loadProgress(){
  try{
    const res = await window.storage.get('kanji-marathon-progress');
    if(res && res.value){ progress = JSON.parse(res.value); }
  }catch(e){ /* no data yet, or storage unavailable */ }
}
async function saveProgress(){
  try{
    await window.storage.set('kanji-marathon-progress', JSON.stringify(progress));
  }catch(e){ storageOk = false; }
}

function dayKey(n){ return 'day'+n; }
function getDayProgress(n){ return progress[dayKey(n)] || {}; }
function dayMasteredCount(n){
  const p = getDayProgress(n);
  const batch = getBatch(n);
  return batch.filter(row => (p[row[0]]||0) >= MASTERY).length;
}
function dayIsDone(n){ return dayMasteredCount(n) === getBatch(n).length; }

/* ---------- RENDER: header / strip ---------- */
function renderHeader(){
  document.getElementById('stripTitle').textContent = TOTAL_DAYS + ' dias · ' + KANJI.length + ' kanji (N4 + N3)';

  let totalMastered = 0;
  KANJI.forEach((row, idx) => {
    const d = Math.floor(idx/BATCH_SIZE)+1;
    const p = getDayProgress(d);
    if((p[row[0]]||0) >= MASTERY) totalMastered++;
  });
  const pct = Math.round(totalMastered / KANJI.length * 100);
  document.getElementById('overallProgress').textContent = pct + '% concluído (' + totalMastered + '/' + KANJI.length + ')';
}

function todayDayNumber(){
  const today = new Date();
  const diff = dateKeyDiff(new Date(START_DATE), today) + 1;
  return Math.min(Math.max(diff,1), TOTAL_DAYS);
}

function renderStrip(){
  const strip = document.getElementById('dayStrip');
  strip.innerHTML = '';
  const tDay = todayDayNumber();
  for(let n=1; n<=TOTAL_DAYS; n++){
    const chip = document.createElement('div');
    chip.className = 'day-chip'
      + (n===selectedDay ? ' selected':'')
      + (n===tDay ? ' today':'')
      + (dayIsDone(n) ? ' done':'');
    chip.innerHTML = '<div class="n">Dia '+n+'</div>';
    chip.addEventListener('click', ()=>{ selectedDay = n; renderAll(); });
    strip.appendChild(chip);
  }
}

/* ---------- RENDER: panel ---------- */
function renderPanel(){
  const batch = getBatch(selectedDay);
  document.getElementById('panelTitle').textContent = 'Dia ' + selectedDay;

  const mastered = dayMasteredCount(selectedDay);
  document.getElementById('dayProgressFill').style.width = (mastered/batch.length*100)+'%';
  document.getElementById('dayProgressNum').textContent = mastered + '/' + batch.length + ' dominados';

  const grid = document.getElementById('tileGrid');
  grid.innerHTML = '';
  const p = getDayProgress(selectedDay);
  batch.forEach(row => {
    const count = p[row[0]] || 0;
    const tile = document.createElement('div');
    tile.className = 'tile' + (count>=MASTERY ? ' mastered':'');
    tile.innerHTML = row[0] + (count>0 && count<MASTERY ? '<div class="mark">'+count+'/10</div>' : '');
    grid.appendChild(tile);
  });

  const startBtn = document.getElementById('startBtn');
  startBtn.textContent = mastered===batch.length ? 'Revisar novamente' : 'Iniciar treino';
}

function renderAll(){
  renderHeader();
  renderStrip();
  renderPanel();
}

/* ---------- DRILL ---------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function startDrill(){
  const batch = getBatch(selectedDay);
  const p = getDayProgress(selectedDay);
  drillQueue = shuffle(batch.filter(row => (p[row[0]]||0) < MASTERY));
  if(drillQueue.length===0){ drillQueue = shuffle(batch); }
  drillIndex = 0;
  flipped = false;
  document.getElementById('overlay').classList.add('active');
  renderDrill();
}

function currentDrillCount(){
  const p = getDayProgress(selectedDay);
  const row = drillQueue[drillIndex];
  return p[row[0]] || 0;
}

function renderDrill(){
  const box = document.getElementById('drillBox');
  if(drillQueue.length===0){
    box.innerHTML =
      '<div class="done-screen">'
        +'<div class="glyph">修</div>'
        +'<h3>Dia '+selectedDay+' dominado!</h3>'
        +'<p>Todos os 10 kanji de hoje bateram 10 acertos.</p>'
        +'<button class="btn" id="drillCloseBtn">Voltar</button>'
      +'</div>';
    document.getElementById('drillCloseBtn').addEventListener('click', closeDrill);
    return;
  }
  const row = drillQueue[drillIndex];
  const count = currentDrillCount();
  const meanings = row[1], on = row[2], kun = row[3];

  let dots = '';
  for(let i=0;i<MASTERY;i++){ dots += '<div class="dot'+(i<count?' filled':'')+'"></div>'; }

  box.innerHTML =
    '<div class="drill-top">'
      +'<span class="lbl">Dia '+selectedDay+' · restam '+drillQueue.length+'</span>'
      +'<button class="close-x" id="closeX">fechar ✕</button>'
    +'</div>'
    +'<div class="dots">'+dots+'</div>'
    +'<div class="flip-scene"><div class="flip-card" id="flipCard">'
      +'<div class="face front"><div class="k">'+row[0]+'</div><div class="tap">toque para virar</div></div>'
      +'<div class="face back">'
        +'<div class="meaning">'+meanings+'</div>'
        +(on ? '<div class="reading-row"><b>ON</b>'+on+'</div>' : '')
        +(kun ? '<div class="reading-row"><b>KUN</b>'+kun+'</div>' : '')
      +'</div>'
    +'</div></div>'
    +'<div class="answer-row">'
      +'<button class="btn wrong" id="wrongBtn">Errei</button>'
      +'<button class="btn right" id="rightBtn">Acertei</button>'
    +'</div>'
    +'<div class="queue-note">Vire o card, tente lembrar antes de responder.</div>';

  const card = document.getElementById('flipCard');
  card.classList.toggle('flipped', flipped);
  card.addEventListener('click', ()=>{ flipped = !flipped; card.classList.toggle('flipped', flipped); });
  document.getElementById('closeX').addEventListener('click', closeDrill);
  document.getElementById('wrongBtn').addEventListener('click', ()=>answer(false));
  document.getElementById('rightBtn').addEventListener('click', ()=>answer(true));
}

function answer(correct){
  const row = drillQueue[drillIndex];
  const k = row[0];
  if(!progress[dayKey(selectedDay)]) progress[dayKey(selectedDay)] = {};
  const p = progress[dayKey(selectedDay)];
  let count = p[k] || 0;
  if(correct){ count = Math.min(MASTERY, count+1); }
  p[k] = count;
  saveProgress();

  // remove from queue if mastered, else send to back of queue
  drillQueue.splice(drillIndex,1);
  if(count < MASTERY){
    const insertAt = Math.min(drillQueue.length, 2 + Math.floor(Math.random()*2));
    drillQueue.splice(insertAt, 0, row);
  }
  if(drillIndex >= drillQueue.length) drillIndex = 0;
  flipped = false;
  renderDrill();
  renderStrip();
}

function closeDrill(){
  document.getElementById('overlay').classList.remove('active');
  renderAll();
}

/* ---------- INIT ---------- */
document.getElementById('startBtn').addEventListener('click', startDrill);
document.getElementById('resetBtn').addEventListener('click', async ()=>{
  if(confirm('Isso vai apagar todo o progresso salvo. Continuar?')){
    progress = {};
    await saveProgress();
    renderAll();
  }
});

(async function init(){
  await loadProgress();
  selectedDay = todayDayNumber();
  renderAll();
})();
</script>
</body>
